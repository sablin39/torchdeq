[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchdeq"
version = "0.2.0"
description = "A PyTorch Lib for DEQs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Zhengyang Geng", email = "zhengyanggeng@gmail.com"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.5",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/locuslab/torchdeq"

[tool.setuptools.packages.find]
exclude = ["deq-zoo*", "build*", "*.egg-info*", "tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module-level import not at top of file (docstrings before imports)
    "E731",   # lambda assignment (pre-existing in grad.py)
    "F401",   # imported but unused (re-exports in __init__.py)
    "F403",   # star imports used throughout for public API
    "I001",   # import sorting (pre-existing throughout)
    "W291",   # trailing whitespace (pre-existing)
    "W292",   # no newline at end of file (pre-existing)
    "W293",   # blank line contains whitespace (pre-existing)
]
